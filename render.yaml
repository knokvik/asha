services:
  - type: web
    name: asha-pack-server
    runtime: python
    rootDir: pack-server
    buildCommand: python build_packs.py --source content_packs_source/geo --language-source content_packs_source/l10n --output content_packs && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: asha-backend
    runtime: python
    rootDir: backend
    buildCommand: python scripts/build_content_packs.py --source content_packs_source/geo --language-source content_packs_source/l10n --output content_packs/map-india.zip && pip install -r requirements.txt
    # entrypoint.sh runs migrations, then starts the real API; no demo seed data.
    startCommand: sh entrypoint.sh
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # Render's network is IPv4-only. Use the Supabase shared pooler URI
      # copied from Dashboard > Connect > Session pooler (port 5432).
      - key: DATABASE_POOL_MODE
        value: session
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://localhost:6379/1
      - key: SYNC_BATCH_MAX_RECORDS
        value: "500"
