services:
  postgres:
    image: postgres:16-alpine
    container_name: asha_postgres
    environment:
      POSTGRES_DB: asha_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asha_secure_password_2026
    ports:
      # 5432 is commonly occupied by a host PostgreSQL installation. The
      # backend reaches this service through the Compose network on 5432;
      # 5433 is only for optional host-side database administration.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asha_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: asha_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asha_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:asha_secure_password_2026@postgres:5432/asha_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
      DEBUG: "development"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asha_celery_worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:asha_secure_password_2026@postgres:5432/asha_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web_dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: asha_web_dashboard
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
