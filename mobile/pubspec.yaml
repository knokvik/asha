name: asha_platform
description: "ASHA Digital Platform — offline-first health information system for ASHA workers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database — use drift directly with sqlcipher, NOT drift_flutter
  # drift_flutter is excluded because it pulls in sqlite3_flutter_libs which
  # conflicts with sqlcipher_flutter_libs (both use eu.simonbinder namespace).
  drift: ^2.18.0
  sqlcipher_flutter_libs: 0.6.8
  sqlite3: ^2.4.6

  # State management & navigation
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^18.0.2

  # Security & auth
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.7.0
  bcrypt: ^1.1.3

  # Utilities
  uuid: ^4.4.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.0
  crypto: ^3.0.3
  archive: ^3.6.1

  # Networking & sync
  http: ^1.2.2
  http_certificate_pinning: ^3.0.2
  workmanager: ^0.10.10

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.1
  geolocator: ^14.0.3

  # BLE
  flutter_reactive_ble: ^5.3.0
  # Android Nearby Connections for towerless ASHA-to-ASHA exchange.
  nearby_connections: ^4.3.0

  # Notifications
  flutter_local_notifications: ^22.3.2

  # TTS. flutter_tts stays for the existing result readout.
  # They speak / I ask use the offline Dolphin, IndicTrans2, and Piper voices.
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  record: 6.2.1
  sherpa_onnx: ^1.13.8
  onnxruntime_core: ^0.1.0+onnxruntime-1.17.1
  onnxruntime_binaries: ^1.17.1+1
  ffi: ^2.1.4
  characters: ^1.4.0

  core_model:
    path: packages/core_model
  core_triage:
    path: packages/core_triage
  core_referral:
    path: packages/core_referral
  triage:
    path: packages/triage
  geo_intel:
    path: packages/geo_intel

  # Maps. Offline raster MBTiles via flutter_map. See packages/geo_intel/README.md.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2

  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.0

dependency_overrides:
  http: ^1.2.2
  # Force permission_handler to latest to satisfy compileSdk >= 34 requirement
  permission_handler: ^13.0.2
  permission_handler_android: ^14.1.0
  permission_handler_platform_interface: ^4.4.1
  permission_handler_apple: ^9.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.18.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/svg/
    - assets/lexicon/
    - assets/incentives/
    - assets/search/
    - assets/triage/
    - packages/triage/lib/data/pack/
    - packages/triage/lib/data/model/
    - packages/imci_engine/lib/data/imci_tables/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
